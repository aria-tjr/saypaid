# One-click hosted demo on Render (mock PayPal + offline AI, no secrets needed).
# Switch PAYPAL_MODE / LLM_PROVIDER and add secrets in the Render dashboard for sandbox + LLM mode.
services:
  - type: web
    name: saypaid
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: "node server.js"
    envVars:
      - key: PAYPAL_MODE
        value: mock
      - key: LLM_PROVIDER
        value: offline
